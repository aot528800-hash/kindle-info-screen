<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>极简时钟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:#ffffff;color:#111111;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  text-align:center;
  -webkit-text-size-adjust:100%;
}
.wrap{letter-spacing:1px;}
.time{
  white-space:nowrap;
  font-size:148px;font-weight:bold;line-height:1;
  color:#111111;letter-spacing:-6px;
  text-shadow:0 0 1px rgba(0,0,0,0.15);
}
.time .sec{font-size:84px;font-weight:600;color:#777777;letter-spacing:-3px;margin-left:8px;}
.wk{
  font-size:46px;font-weight:bold;color:#111111;
  margin-top:46px;letter-spacing:16px;padding-left:16px;
}
.date{
  font-size:38px;font-weight:400;color:#555555;
  margin-top:20px;letter-spacing:5px;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="time"><span id="h">--:--</span><span class="sec" id="sec">:--</span></div>
  <div class="wk" id="wk">--</div>
  <div class="date" id="date">----</div>
</div>
<script>
var WEEK=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function pad2(n){return n<10?'0'+n:''+n;}
// 权威时间锚定: 以 weather.json 的 updated_ts 为基准, 自走秒 + 每5分钟校准,
// 彻底绕开 Kindle 浏览器被偏移 8 小时的本地时钟。
var baseRealMs=0;
var baseLocal=0;
function gotAnchor(epochSec){
  if(!epochSec)return;
  baseRealMs=epochSec*1000;
  baseLocal=Date.now();
}
function loadAnchor(){
  var xhr=new XMLHttpRequest();
  xhr.open('GET','weather.json?t='+Date.now(),true);
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4&&xhr.status===200){
      try{var o=JSON.parse(xhr.responseText);if(o&&o.updated_ts)gotAnchor(o.updated_ts);}catch(e){}
    }
  };
  xhr.send();
}
function beiDate(){
  if(baseRealMs>0){
    var elapsed=Date.now()-baseLocal;
    return new Date(baseRealMs+elapsed+8*3600*1000);
  }
  return new Date(new Date().getTime()+8*3600*1000);
}
var elH=document.getElementById('h');
var elSec=document.getElementById('sec');
var elWk=document.getElementById('wk');
var elDate=document.getElementById('date');
function tick(){
  var d=beiDate();
  var hh=d.getUTCHours(),mm=d.getUTCMinutes(),ss=d.getUTCSeconds();
  var Y=d.getUTCFullYear(),M=d.getUTCMonth()+1,D=d.getUTCDate(),w=d.getUTCDay();
  elH.innerHTML=pad2(hh)+':'+pad2(mm);
  elSec.innerHTML=':'+pad2(ss);
  elWk.innerHTML=WEEK[w];
  elDate.innerHTML=Y+'年'+M+'月'+D+'日';
}
loadAnchor();
setInterval(loadAnchor,5*60*1000);
tick();
setInterval(tick,1000);
</script>
</body>
</html>
