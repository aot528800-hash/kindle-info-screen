<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>极简时钟 · 周师傅</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:#fff;color:#1a1a1a;font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;}
.wrap{display:flex;align-items:center;width:100%;max-width:900px;padding:40px;}
.left{flex:1;text-align:left;white-space:nowrap;}
.time{font-size:120px;font-weight:200;letter-spacing:-3px;line-height:1;color:#1a1a1a;}
.sec{font-size:60px;font-weight:200;color:#9a9a9a;letter-spacing:-1px;}
.divider{width:1px;background:#e0ded7;margin:0 40px;align-self:stretch;min-height:170px;}
.right{flex:0 0 34%;text-align:left;}
.date{font-size:42px;font-weight:400;color:#1a1a1a;}
.wk{font-size:32px;color:#555;margin-top:12px;}
.lunar{font-size:26px;color:#9a9a9a;margin-top:8px;}
.loc{font-size:22px;color:#c0bdb4;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <span class="time" id="hm">--:--</span><span class="sec" id="sec">:--</span>
  </div>
  <div class="divider"></div>
  <div class="right">
    <div class="date" id="date">--</div>
    <div class="wk" id="wk">--</div>
    <div class="lunar" id="lunar">--</div>
    <div class="loc">重庆市江津区</div>
  </div>
</div>
<script>
(function(){
  var lunarInfo=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055a2,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b5a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,0x0d520];
  function leapMonth(y){return lunarInfo[y-1900]&0xf;}
  function leapDays(y){var lm=leapMonth(y);if(lm){return (lunarInfo[y-1900]&0x10000)?30:29;}return 0;}
  function monthDays(y,m){return (lunarInfo[y-1900]&(0x10000>>m))?30:29;}
  function yearDays(y){var i,sum=348;for(i=0x8000;i>0x8;i>>=1){sum+=(lunarInfo[y-1900]&i)?30:29;}return sum+leapDays(y);}
  var monthName=["正月","二月","三月","四月","五月","六月","七月","八月","九月","十月","冬月","腊月"];
  var nStr1=["日","一","二","三","四","五","六","七","八","九","十"];
  function cnDay(d){
    if(d==10)return "初十";
    if(d==20)return "二十";
    if(d==30)return "三十";
    if(d<10)return "初"+nStr1[d];
    if(d<20)return "十"+nStr1[d-10];
    if(d<30)return "廿"+nStr1[d-20];
    return "三十";
  }
  function toLunar(yy,mm,dd){
    var i,leap=0,temp=0;
    var baseDate=new Date(1900,0,31);
    var objDate=new Date(yy,mm-1,dd);
    var offset=Math.round((objDate-baseDate)/86400000);
    for(i=1900;i<2101&&offset>0;i++){temp=yearDays(i);offset-=temp;}
    if(offset<0){offset+=temp;i--;}
    var year=i,lm=leapMonth(i),isLeap=false;
    for(i=1;i<13&&offset>0;i++){
      if(lm>0&&i==(lm+1)&&!isLeap){isLeap=true;i--;temp=leapDays(year);}
      else{temp=monthDays(year,i);}
      if(isLeap&&i==(lm+1))isLeap=false;
      offset-=temp;
    }
    if(offset==0&&lm>0&&i==lm+1){if(isLeap){isLeap=false;}else{isLeap=true;i--;}}
    if(offset<0){offset+=temp;i--;}
    var month=i,day=offset+1;
    return (isLeap?"闰":"")+monthName[month-1]+cnDay(day);
  }
  var wk=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  function pad(n){return n<10?"0"+n:""+n;}
  function tick(){
    var d=new Date();
    document.getElementById("hm").innerHTML=pad(d.getHours())+":"+pad(d.getMinutes());
    document.getElementById("sec").innerHTML=":"+pad(d.getSeconds());
    document.getElementById("date").innerHTML=(d.getMonth()+1)+"月"+d.getDate()+"日";
    document.getElementById("wk").innerHTML=wk[d.getDay()];
    document.getElementById("lunar").innerHTML="农历"+toLunar(d.getFullYear(),d.getMonth()+1,d.getDate());
  }
  tick();
  setInterval(tick,1000);
})();
</script>
</body>
</html>
