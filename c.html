<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>极简时钟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:#ffffff;color:#111111;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  padding:0;
  text-align:center;
  -webkit-text-size-adjust:100%;
}
.wrap{letter-spacing:1px;padding-bottom:96px;}
.time{
  white-space:nowrap;
  font-size:148px;font-weight:bold;line-height:1;
  color:#111111;letter-spacing:-6px;
  text-shadow:0 0 1px rgba(0,0,0,0.15);
}
.time .sec{font-size:84px;font-weight:600;color:#777777;letter-spacing:-3px;margin-left:8px;}
.wk{
  font-size:46px;font-weight:bold;color:#111111;
  margin-top:46px;letter-spacing:16px;padding-left:16px;
}
.date{
  font-size:38px;font-weight:400;color:#555555;
  margin-top:20px;letter-spacing:5px;
}
/* ——— 统一底部导航：三等分 · 图标+文字 · 当前页胶囊高亮 —— */
.nav{
  position:fixed;left:0;right:0;bottom:0;
  background:#fff;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:stretch;-webkit-align-items:stretch;align-items:stretch;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  padding:10px 12px calc(10px + constant(safe-area-inset-bottom)) 12px;
  border-top:1px solid #e0ded8;
}
.nav a{
  -webkit-box-flex:1;-webkit-flex:1;flex:1;
  max-width:230px;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  margin:0 4px;padding:10px 0 8px;
  border-radius:14px;
  font-size:19px;font-weight:bold;color:#555555;
  text-decoration:none;letter-spacing:1px;
  -webkit-tap-highlight-color:rgba(0,0,0,0);
}
.nav a i{
  display:block;font-style:normal;font-size:26px;line-height:1;margin-bottom:6px;color:#999999;
}
.nav a.on{
  background:#111111;color:#ffffff;
}
.nav a.on i{color:#ffffff;}
.nav a.on b{color:#ffffff;}
</style>
</head>
<body>
<div class="wrap">
  <div class="time"><span id="h">--:--</span><span class="sec" id="sec">:--</span></div>
  <div class="wk" id="wk">--</div>
  <div class="date" id="date">----</div>
</div>
<div class="nav">
  <a href="index.html"><i>☀</i><b>江津信息屏</b></a>
  <a href="c.html" class="on"><i>◷</i><b>极简时钟</b></a>
  <a href="countdown.html"><i>⏱</i><b>倒计时</b></a>
</div>
<script>
var WEEK=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function pad2(n){return n<10?'0'+n:''+n;}
/* ============ 时间引擎 v3: HTTP头为唯一权威, 永远不展示错误时间 ============
   HTTP Date 头: 每次HTTP响应必带, 服务器真实GMT, 永不陈旧、不依赖Actions、不依赖设备钟
   锚点(weather.json updated_ts): 仅当从未拿到HTTP头时兜底; 宽松容差(-9h~+13h)覆盖
        Kindle设备钟偏8h的误判; 不与已有来源倒退
   本地钟: 最后保命(已知偏8h, 仅保证不崩溃)
===================================================================== */
var BEIJING_OFFSET=8*3600*1000;
var ANCHOR_EARLY_MS=9*3600*1000;    // 设备可能偏8h: 锚点"看起来"提前最多9h可接受
var ANCHOR_LATE_MS=15*60*1000;      // 锚点最多滞后15分钟(超过即陈旧, 弃用)
var srcRank=0;        // 3=HTTP头 2=锚点 1=本地钟
var baseRealMs=0;     // 已校准的真实UTC epoch ms
var baseLocal=0;      // 校准时的设备时刻
var lastSync=0;       // 最近一次成功校准的设备时刻
function fallbackBei(){return new Date(new Date().getTime()+BEIJING_OFFSET);}
function realEpochMs(){
  if(baseRealMs>0){return baseRealMs+(new Date().getTime()-baseLocal);}
  return null;
}
function beiDate(){
  var real=realEpochMs();
  if(real!==null)return new Date(real+BEIJING_OFFSET);
  return fallbackBei();
}
function timeSource(){return lastSync>0?3:1;}
function gotAnchor(epochSec,fetchAtMs){
  if(!epochSec)return;
  if(lastSync>0)return;               // 已有更权威来源, 锚点不用
  var t=epochSec*1000;
  var s=Number(fetchAtMs)||Date.now();
  var age=s-t;
  if(age<-ANCHOR_EARLY_MS||age>ANCHOR_LATE_MS)return;  // 离谱偏差 -> 弃用
  if(baseRealMs>0&&t<baseRealMs)return;  // 不比已有新 -> 防倒退
  baseRealMs=t;
  baseLocal=s;
  lastSync=s;
  srcRank=2;
}
function gotHttpDate(gmtMs){
  if(!gmtMs)return;
  baseRealMs=gmtMs;
  baseLocal=new Date().getTime();
  lastSync=baseLocal;
  srcRank=3;
}
function loadAnchor(){
  var fetchAtMs=Date.now();
  var xhr=new XMLHttpRequest();
  xhr.open('GET','weather.json?t='+fetchAtMs,true);
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4&&xhr.status===200){
      var dHdr=xhr.getResponseHeader?xhr.getResponseHeader('Date'):null;
      if(dHdr){var gmtMs=Date.parse(dHdr);if(!isNaN(gmtMs))gotHttpDate(gmtMs);}
      try{var o=JSON.parse(xhr.responseText);if(o&&o.updated_ts)gotAnchor(o.updated_ts,fetchAtMs);}catch(e){}
    }
  };
  xhr.send();
}
var elH=document.getElementById('h');
var elSec=document.getElementById('sec');
var elWk=document.getElementById('wk');
var elDate=document.getElementById('date');
function tick(){
  var d=beiDate();
  var hh=d.getUTCHours(),mm=d.getUTCMinutes(),ss=d.getUTCSeconds();
  var Y=d.getUTCFullYear(),M=d.getUTCMonth()+1,D=d.getUTCDate(),w=d.getUTCDay();
  elH.innerHTML=pad2(hh)+':'+pad2(mm);
  elSec.innerHTML=':'+pad2(ss);
  elWk.innerHTML=WEEK[w];
  elDate.innerHTML=Y+'年'+M+'月'+D+'日';
}
loadAnchor();
setInterval(loadAnchor,5*60*1000);
tick();
setInterval(tick,1000);
</script>
</body>
</html>
