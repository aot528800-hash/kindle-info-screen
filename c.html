var DAYTOTAL=7671;
var MONCN=['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
var DAYCN=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
var WEEK=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function pad2(n){return n<10?'0'+n:''+n;}
function dayIdx(yr,mo,da){return parseInt((Date.UTC(yr,mo-1,da)-BEGIN)/86400000);}
function lunarLabel(y,m,d){
  var i=dayIdx(y,m,d);
  if(i<0||i>=DAYTOTAL)return '';
  var mo=MON[i],da=DAY[i],leap=mo<0;
  mo=leap?-mo:mo;
  return (leap?'闰':'')+MONCN[mo-1]+DAYCN[da-1];
}
// 以权威时间基准(weather.json 的 updated_ts)锚定, 自走秒 + 定时重新校准。
// 彻底绕开 Kindle 浏览器被偏移 8 小时的本地时钟读数。
var baseRealMs=0;   // 权威真实时间戳(ms)
var baseLocal=0;    // 读取权威时间时, 设备本地 clock (用于算流逝秒数)
function gotAnchor(epochSec){
  if(!epochSec)return;
  baseRealMs=epochSec*1000;
  baseLocal=Date.now();
}
function loadAnchor(){
  var xhr=new XMLHttpRequest();
  xhr.open('GET','weather.json?t='+Date.now(),true);
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4&&xhr.status===200){
      try{ var o=JSON.parse(xhr.responseText); if(o&&o.updated_ts)gotAnchor(o.updated_ts); }catch(e){}
    }
  };
  xhr.send();
}
function beiDate(){
  if(baseRealMs>0){
    var elapsed=Date.now()-baseLocal;      // 设备时钟走时(秒速正常,仅时区显示偏)
    return new Date(baseRealMs+elapsed+8*3600*1000); // 真实时刻+8h=北京时间, 再按UTC读
  }
  return new Date(new Date().getTime()+8*3600*1000); // 兜底: 无锚点时用设备时间
}
function tick(){
  var d=beiDate();
  document.getElementById('h').innerHTML=pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes());
  document.getElementById('sec').innerHTML=':'+pad2(d.getUTCSeconds());
  document.getElementById('date').innerHTML=(d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日';
  document.getElementById('wk').innerHTML=WEEK[d.getUTCDay()];
  document.getElementById('lunar').innerHTML='农历'+lunarLabel(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());
}
loadAnchor();
setInterval(loadAnchor,5*60*1000); // 每5分钟重新校准(天气30分钟更新一次)
tick();
setInterval(tick,1000);
