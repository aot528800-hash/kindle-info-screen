<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>日历 · 放假调休节气</title>
<style>
/* ========== 全局 ========== */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#fff;}
body{
  color:#111111;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif;
  text-align:center;padding:14px 10px 100px;
  -webkit-text-size-adjust:none;   /* 禁掉Kindle自动放大字号, 否则撑破固定行高 */
  text-size-adjust:none;
}
/* ========== 头部: 年月 + 翻月 (table三列, 物理隔离绝无重叠, 老内核最稳) ========== */
.hd{
  display:table;table-layout:fixed;width:100%;
  margin-bottom:12px;border-collapse:collapse;
}
.hd .c{
  display:table-cell;vertical-align:middle;text-align:center;
  -webkit-tap-highlight-color:rgba(0,0,0,0);
}
.hd .l,.hd .r{width:18%;}
.hd .m{width:64%;}
.hd .yr{font-size:32px;font-weight:bold;letter-spacing:3px;display:inline-block;}
.hd .nav2{
  font-size:42px;line-height:1;cursor:pointer;color:#111;
  display:inline-block;padding:6px 16px;
}
/* ========== 图例 (黑白灰, 用深浅区分) ========== */
.leg{text-align:center;margin-bottom:10px;font-size:14px;}
.leg span{display:inline-block;margin:0 8px;color:#777;line-height:16px;}
.leg b{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:5px;vertical-align:-2px;}
.leg .h{background:#111;}       /* 放假 = 黑块 */
.leg .d{background:#888;}       /* 调休 = 灰块 */
.leg .j{background:#d8d6d2;}    /* 节气 = 浅灰块 */
/* ========== 日历表格: table布局(老内核最稳, 天然等宽等高对齐) ==========
   关键: border-collapse:separate + border-spacing:0 + 每格独立边框
   (collapse 模式下单格加粗边框会触发内核重算列宽 -> 整行错位) */
table.cal{
  width:100%;table-layout:fixed;
  border-collapse:separate;border-spacing:0;
  border-left:1px solid #b9b6b0;border-top:1px solid #111;
}
table.cal th,table.cal td{
  width:14.2857%;padding:0;
  border-right:1px solid #b9b6b0;border-bottom:1px solid #b9b6b0;
}
/* 星期标题行 */
table.cal th{
  font-size:16px;font-weight:bold;color:#111;
  padding:6px 0;letter-spacing:1px;background:#fff;
  border-bottom:2px solid #111;
}
/* 格子: 固定结构 = 日期行30px + 标签行28px, 所有格子完全一致 */
td.cell{height:64px;vertical-align:top;background:#fff;}
/* 日期数字: 今天用内层黑框(不碰td边框, 绝不改变列宽) */
td.cell .dnum{
  height:30px;line-height:30px;font-size:26px;font-weight:bold;color:#111;
}
td.cell .tags{
  height:28px;overflow:hidden;padding:0 2px;
  word-break:keep-all;line-height:14px;
}
td.cell .tags span{
  display:block;line-height:14px;font-size:11px;color:#111;
  overflow:hidden;white-space:nowrap;
}
/* 放假 = 纯黑粗体大号 */
td.cell.hol .tags span{color:#111;font-weight:bold;font-size:12px;line-height:15px;}
/* 调休 = 深灰粗体 */
td.cell.adj .tags span{color:#666;font-weight:bold;font-size:11px;}
/* 节气 = 中灰 */
td.cell.jq .tags span{color:#8a8a8a;font-size:11px;}
/* 周末 = 日期加粗并加框强调 (墨水屏清晰) */
td.cell.wc .dnum{font-weight:bold;}
/* 今天 = 浅灰底 + 日期数字黑色粗框(内层元素, 不影响表格列宽计算) */
td.cell.today{background:#e8e8e6;}
td.cell.today .dnum{
  color:#111;border:3px solid #111;background:#fff;
  height:30px;line-height:24px;margin:0 2px;
}
/* 非本月补位 = 浅底 + 灰字 */
td.cell.off{background:#f2f0ec;}
td.cell.off .dnum{color:#c8c5bf;}
td.cell.off .tags span{color:#c8c5bf;}
/* ========== 页脚 ========== */
.foot{font-size:13px;color:#999;margin-top:12px;letter-spacing:1px;}
/* ========== 导航 ========== */
.nav{
  position:fixed;left:0;right:0;bottom:0;background:#fff;
  text-align:center;padding:10px 6px 10px;border-top:1px solid #e0ded8;
}
.nav a{
  display:inline-block;width:24%;max-width:200px;
  margin:0 0.5%;padding:8px 0 7px;border-radius:12px;
  font-size:18px;font-weight:bold;color:#555555;text-decoration:none;
  letter-spacing:1px;-webkit-tap-highlight-color:rgba(0,0,0,0);
}
.nav a i,.nav a b{font-style:normal;font-weight:bold;}
.nav a i{display:block;font-size:24px;line-height:1;margin-bottom:5px;color:#999999;}
.nav a.on{background:#111111;color:#ffffff;}
.nav a.on i,.nav a.on b{color:#ffffff;}
</style>
</head>
<body>

<div class="hd">
  <div class="c l"><span class="nav2" onclick="step(-1)">‹</span></div>
  <div class="c m"><span class="yr" id="ym">--</span></div>
  <div class="c r"><span class="nav2" onclick="step(1)">›</span></div>
</div>

<div class="leg">
  <span><b class="h"></b>放假</span>
  <span><b class="d"></b>调休上班</span>
  <span><b class="j"></b>节气</span>
</div>

<table class="cal" id="cal"></table>

<div class="foot" id="foot">灰底 + 日期黑框 = 今天</div>

<div class="nav">
  <a href="index.html"><i>☀</i><b>江津信息屏</b></a>
  <a href="c.html"><i>◷</i><b>极简时钟</b></a>
  <a href="countdown.html"><i>⏱</i><b>倒计时</b></a>
  <a href="calendar.html" class="on"><i>▦</i><b>日历</b></a>
</div>

<script>
/* ======== 2026年 国务院 放假调休安排 (国办发明电〔2025〕7号) ======== */
var HOL = {
  '2026-1-1':{n:'元旦'},'2026-1-2':{n:'元旦'},'2026-1-3':{n:'元旦'},
  '2026-1-4':{w:'班'},
  '2026-2-14':{w:'班'},
  '2026-2-15':{n:'除夕'},'2026-2-16':{},'2026-2-17':{},'2026-2-18':{},'2026-2-19':{},'2026-2-20':{},'2026-2-21':{},'2026-2-22':{},'2026-2-23':{n:'春节'},
  '2026-2-28':{w:'班'},
  '2026-4-4':{},'2026-4-5':{n:'清明'},'2026-4-6':{},
  '2026-5-1':{n:'劳动'},'2026-5-2':{},'2026-5-3':{},'2026-5-4':{},'2026-5-5':{},
  '2026-5-9':{w:'班'},
  '2026-6-19':{n:'端午'},'2026-6-20':{},'2026-6-21':{},
  '2026-9-25':{n:'中秋'},'2026-9-26':{},'2026-9-27':{},
  '2026-9-20':{w:'班'},
  '2026-10-1':{n:'国庆'},'2026-10-2':{},'2026-10-3':{},'2026-10-4':{},'2026-10-5':{},'2026-10-6':{},'2026-10-7':{},
  '2026-10-10':{w:'班'}
};
/* ======== 2026年 二十四节气 ======== */
var SOL = {
  '2026-2-4':'立春','2026-2-18':'雨水','2026-3-5':'惊蛰','2026-3-20':'春分',
  '2026-4-5':'清明','2026-4-20':'谷雨','2026-5-5':'立夏','2026-5-21':'小满',
  '2026-6-6':'芒种','2026-6-21':'夏至','2026-7-7':'小暑','2026-7-23':'大暑',
  '2026-8-7':'立秋','2026-8-23':'处暑','2026-9-7':'白露','2026-9-23':'秋分',
  '2026-10-8':'寒露','2026-10-23':'霜降','2026-11-7':'立冬','2026-11-22':'小雪',
  '2026-12-7':'大雪','2026-12-22':'冬至','2026-1-5':'小寒','2026-1-20':'大寒'
};

function $(id){return document.getElementById(id);}
var viewY, viewM;

function padNum(y,m,d){return y+'-'+m+'-'+d;}
function todayStr(){
  var d=beiDate();
  return padNum(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate());
}
function step(delta){
  viewM+=delta;
  if(viewM<0){viewM=11;viewY--;}
  if(viewM>11){viewM=0;viewY++;}
  render();
}

function cellHtml(day, y, m, off){
  var key=padNum(y,m,day);
  var today=todayStr();
  var dow=(new Date(Date.UTC(y,m-1,day))).getUTCDay();
  var hol=HOL[key], sol=SOL[key];
  var cls='cell';
  if(off){
    cls+=' off';
  } else {
    if(dow===0||dow===6)cls+=' wc';
    if(hol){ if(hol.w){cls+=' adj';} else {cls+=' hol';} }
    if(sol)cls+=' jq';
    if(key===today)cls+=' today';
    // 今天优先保留放假/调休语义, 若两者皆无则纯today
  }
  var dnum='<div class="dnum">'+(day===''?'':day)+'</div>';
  var tags='';
  if(!off){
    if(hol&&hol.n)tags+='<span>'+hol.n+'</span>';
    else if(hol&&hol.w)tags+='<span>班</span>';
    if(sol)tags+='<span>'+sol+'</span>';
  }
  var tagHtml=tags?'<div class="tags">'+tags+'</div>':'<div class="tags"></div>';
  return '<td class="'+cls+'">'+dnum+tagHtml+'</td>';
}

function render(){
  $('ym').innerHTML=viewY+'年'+(viewM+1)+'月';
  var daysInMonth=new Date(Date.UTC(viewY,viewM+1,0)).getUTCDate();
  var firstDow=new Date(Date.UTC(viewY,viewM,1)).getUTCDay();
  var html='<tr>';
  // 星期标题
  var wd=['日','一','二','三','四','五','六'];
  for(var w=0;w<7;w++)html+='<th class="'+(w===0||w===6?'hk':'')+'">'+wd[w]+'</th>';
  html+='</tr>';
  var day=1;
  var started=false;
  // 最多6个星期行
  for(var r=0;r<6;r++){
    html+='<tr>';
    for(var d=0;d<7;d++){
      var idx=r*7+d;
      if(!started&&idx<firstDow){
        html+=cellHtml('','','',true);
      } else if(!started){
        started=true;html+=cellHtml(day,viewY,viewM+1,false);day++;
      } else if(day<=daysInMonth){
        html+=cellHtml(day,viewY,viewM+1,false);day++;
      } else {
        html+=cellHtml('','','',true);
      }
    }
    html+='</tr>';
    if(day>daysInMonth)break;   // 已填满, 提前结束
  }
  $('cal').innerHTML=html;
}

/* —— 时间引擎: HTTP头校准, 绕开Kindle时区 —— */
var baseRealMs=0, baseLocal=0;
function gotHttpDate(gmtMs){baseRealMs=gmtMs;baseLocal=Date.now();}
function beiDate(){
  if(baseRealMs>0)return new Date(baseRealMs+(Date.now()-baseLocal));
  return new Date();
}
(function sync(){
  var xhr=new XMLHttpRequest();
  xhr.open('GET','weather.json?t='+Date.now(),true);
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4&&xhr.status===200){
      var h=xhr.getResponseHeader?xhr.getResponseHeader('Date'):null;
      if(h){var g=Date.parse(h);if(!isNaN(g))gotHttpDate(g);}
      init();
    }
  };
  try{xhr.send();}catch(e){init();}
})();
function init(){
  var d=beiDate();
  viewY=d.getUTCFullYear(); viewM=d.getUTCMonth();
  render();
}
setTimeout(function(){ if(typeof viewY==='undefined'){ viewY=2026; viewM=8; render(); } },2500);
</script>
</body>
</html>
