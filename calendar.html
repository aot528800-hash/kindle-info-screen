<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>日历 · 放假调休节气</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#fff;}
body{
  color:#111111;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif;
  text-align:center;padding:16px 12px 96px;
  -webkit-text-size-adjust:100%;
}
/* ===== 头部: 年月 + 翻月 ===== */
.hd{display:-webkit-box;display:-webkit-flex;display:flex;align-items:center;justify-content:center;margin-bottom:14px;position:relative;}
.hd .yr{font-size:36px;font-weight:bold;letter-spacing:4px;}
.hd .nav2{
  font-size:44px;line-height:1;width:58px;cursor:pointer;color:#111;
  font-weight:normal;text-align:center;-webkit-tap-highlight-color:rgba(0,0,0,0);
}
.hd .nav2.l{position:absolute;left:8px;top:50%;margin-top:-22px;}
.hd .nav2.r{position:absolute;right:8px;top:50%;margin-top:-22px;}
/* ===== 图例 ===== */
.leg{display:-webkit-box;display:-webkit-flex;display:flex;justify-content:center;margin-bottom:12px;font-size:14px;}
.leg span{margin:0 8px;color:#777;display:-webkit-box;display:-webkit-flex;display:flex;align-items:center;}
.leg b{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:5px;flex:none;}
.leg .h{background:#e55039;}
.leg .d{background:#f5c542;}
.leg .j{background:#2e8b57;}
/* ===== 星期标题 ===== */
.wrow{display:-webkit-box;display:-webkit-flex;display:flex;margin-bottom:4px;}
.wrow div{
  -webkit-box-flex:1;-webkit-flex:1;flex:1;text-align:center;
  font-size:17px;font-weight:bold;color:#111;padding:6px 0;letter-spacing:1px;
}
.wrow div.hk{color:#e55039;}
/* ===== 月历网格 (纯flex, 不用table, Kindle兼容最好) ===== */
.cal{display:block;border-top:2px solid #111;border-left:2px solid #111;}
.row{display:-webkit-box;display:-webkit-flex;display:flex;}
.cell{
  -webkit-box-flex:1;-webkit-flex:1;flex:1;position:relative;
  height:66px;border-right:2px solid #111;border-bottom:2px solid #111;
  overflow:hidden;
}
.cell .dnum{font-size:26px;font-weight:bold;text-align:center;line-height:1;margin-top:6px;}
.cell .tag{font-size:11px;line-height:1.1;text-align:center;margin-top:8px;padding:0 2px;}
.cell .tag .t{display:block;color:#111;}
/* 非本月(前后补位): 空心 */
.cell.off{background:#f5f4f2;border-right:2px solid #e6e4e0;border-bottom:2px solid #e6e4e0;}
.cell.off .dnum{color:#c9c6c0;}
/* 周六周日日期红 */
.cell.wc .dnum{color:#e55039;}
.cell.wc .tag .t{color:#e55039;}
/* 标签颜色 */
.cell.hol .tag .t{color:#e55039;font-size:11px;}
.cell.adj .tag .t{color:#b8860b;font-weight:bold;font-size:11px;}
.cell.jq .tag .t{color:#2e8b57;font-size:10.5px;}
/* 今天: 实线边框 + 浅底(兼容旧内核, 不用inset阴影) */
.cell.today{border:3px solid #111;background:#f0f0ee;}
.cell.today .dnum{margin-top:4px;}
/* 顶部边线修正: 第一行格子补上上边 */
.cal .row:first-child .cell{border-top:0;margin-top:0;}
.cal .row .cell:first-child{border-left:0;}
/* ===== 页脚 ===== */
.foot{font-size:13px;color:#999;margin-top:12px;letter-spacing:1px;}
/* ===== 导航 ===== */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:stretch;-webkit-align-items:stretch;align-items:stretch;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;padding:10px 12px 10px 12px;border-top:1px solid #e0ded8;}
.nav a{-webkit-box-flex:1;-webkit-flex:1;flex:1;max-width:200px;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;margin:0 4px;padding:10px 0 8px;border-radius:14px;font-size:19px;font-weight:bold;color:#555555;text-decoration:none;letter-spacing:1px;-webkit-tap-highlight-color:rgba(0,0,0,0);}
.nav a i,.nav a b{font-style:normal;font-weight:bold;}
.nav a i{display:block;font-size:26px;line-height:1;margin-bottom:6px;color:#999999;}
.nav a.on{background:#111111;color:#ffffff;}
.nav a.on i,.nav a.on b{color:#ffffff;}
</style>
</head>
<body>

<div class="hd">
  <span class="nav2 l" onclick="step(-1)">‹</span>
  <span class="yr" id="ym">--</span>
  <span class="nav2 r" onclick="step(1)">›</span>
</div>

<div class="leg">
  <span><b class="h"></b>放假</span>
  <span><b class="d"></b>调休上班</span>
  <span><b class="j"></b>节气</span>
</div>

<div class="wrow">
  <div class="hk">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="hk">六</div>
</div>

<div class="cal" id="cal"></div>

<div class="foot" id="foot">黑色粗边框格子 = 今天</div>

<div class="nav">
  <a href="index.html"><i>☀</i><b>江津信息屏</b></a>
  <a href="c.html"><i>◷</i><b>极简时钟</b></a>
  <a href="countdown.html"><i>⏱</i><b>倒计时</b></a>
  <a href="calendar.html" class="on"><i>▦</i><b>日历</b></a>
</div>

<script>
/* ======== 2026年 国务院 放假调休安排 (国办发明电〔2025〕7号) ======== */
var HOL = {
  '2026-1-1':{n:'元旦'},'2026-1-2':{h:'元旦'},'2026-1-3':{h:'元旦'},
  '2026-1-4':{w:'班'},
  '2026-2-14':{w:'班'},
  '2026-2-15':{n:'除夕'},'2026-2-16':{},'2026-2-17':{},'2026-2-18':{},'2026-2-19':{},'2026-2-20':{},'2026-2-21':{},'2026-2-22':{},'2026-2-23':{n:'春节'},
  '2026-2-28':{w:'班'},
  '2026-4-4':{},'2026-4-5':{n:'清明'},'2026-4-6':{},
  '2026-5-1':{n:'劳动'},'2026-5-2':{},'2026-5-3':{},'2026-5-4':{},'2026-5-5':{},
  '2026-5-9':{w:'班'},
  '2026-6-19':{n:'端午'},'2026-6-20':{},'2026-6-21':{},
  '2026-9-25':{n:'中秋'},'2026-9-26':{},'2026-9-27':{},
  '2026-9-20':{w:'班'},
  '2026-10-1':{n:'国庆'},'2026-10-2':{},'2026-10-3':{},'2026-10-4':{},'2026-10-5':{},'2026-10-6':{},'2026-10-7':{},
  '2026-10-10':{w:'班'}
};
/* ======== 2026年 二十四节气 ======== */
var SOL = {
  '2026-2-4':'立春','2026-2-18':'雨水','2026-3-5':'惊蛰','2026-3-20':'春分',
  '2026-4-5':'清明','2026-4-20':'谷雨','2026-5-5':'立夏','2026-5-21':'小满',
  '2026-6-6':'芒种','2026-6-21':'夏至','2026-7-7':'小暑','2026-7-23':'大暑',
  '2026-8-7':'立秋','2026-8-23':'处暑','2026-9-7':'白露','2026-9-23':'秋分',
  '2026-10-8':'寒露','2026-10-23':'霜降','2026-11-7':'立冬','2026-11-22':'小雪',
  '2026-12-7':'大雪','2026-12-22':'冬至','2026-1-5':'小寒','2026-1-20':'大寒'
};

function $(id){return document.getElementById(id);}
var viewY, viewM;

function padNum(y,m,d){return y+'-'+m+'-'+d;}
function todayStr(){
  var d=beiDate();
  return padNum(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate());
}
function step(delta){
  viewM+=delta;
  if(viewM<0){viewM=11;viewY--;}
  if(viewM>11){viewM=0;viewY++;}
  render();
}

function cellHtml(day, y, m, off){
  var key=padNum(y,m,day);
  var today=todayStr();
  var dow=(new Date(Date.UTC(y,m-1,day))).getUTCDay();
  var hol=HOL[key], sol=SOL[key];
  var cls='cell';
  if(off)cls+=' off';
  else{
    if(dow===0||dow===6)cls+=' wc';
    if(hol&&hol.h){cls+=' hol';}
    else if(hol&&hol.w){cls+=' adj';}
    if(sol)cls+=' jq';
    if(key===today)cls+=' today';
  }
  var dnum='<div class="dnum">'+day+'</div>';
  var tagTxt='';
  if(!off){
    if(hol&&hol.n)tagTxt+='<span class="t">'+hol.n+'</span>';
    else if(hol&&hol.w)tagTxt+='<span class="t">班</span>';
    if(sol)tagTxt+='<span class="t">'+sol+'</span>';
  }
  var tagHtml=tagTxt?'<div class="tag">'+tagTxt+'</div>':'';
  return '<div class="'+cls+'">'+dnum+tagHtml+'</div>';
}

function render(){
  $('ym').innerHTML=viewY+'年'+(viewM+1)+'月';
  var cal=$('cal');
  cal.innerHTML='';
  var daysInMonth=new Date(Date.UTC(viewY,viewM+1,0)).getUTCDate();
  var firstDow=new Date(Date.UTC(viewY,viewM,1)).getUTCDay();
  var html='';
  var day=1;
  var started=false;
  // 最多6个星期行
  for(var w=0;w<6;w++){
    html+='<div class="row">';
    for(var d=0;d<7;d++){
      var idx=w*7+d;
      if(!started&&idx<firstDow){html+=cellHtml('','','',true);}
      else if(!started){started=true;html+=cellHtml(day,viewY,viewM+1,false);day++;}
      else if(day<=daysInMonth){html+=cellHtml(day,viewY,viewM+1,false);day++;}
      else {html+=cellHtml('','','',true);}
    }
    html+='</div>';
    if(day>daysInMonth)break;   // 已填满, 提前结束
  }
  cal.innerHTML=html;
}

/* —— 时间引擎: HTTP头校准, 绕开Kindle时区 —— */
var baseRealMs=0, baseLocal=0;
function gotHttpDate(gmtMs){baseRealMs=gmtMs;baseLocal=Date.now();}
function beiDate(){
  if(baseRealMs>0)return new Date(baseRealMs+(Date.now()-baseLocal));
  return new Date();
}
(function sync(){
  var xhr=new XMLHttpRequest();
  xhr.open('GET','weather.json?t='+Date.now(),true);
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4&&xhr.status===200){
      var h=xhr.getResponseHeader?xhr.getResponseHeader('Date'):null;
      if(h){var g=Date.parse(h);if(!isNaN(g))gotHttpDate(g);}
      init();
    }
  };
  try{xhr.send();}catch(e){init();}
})();
function init(){
  var d=beiDate();
  viewY=d.getUTCFullYear(); viewM=d.getUTCMonth();
  render();
}
setTimeout(function(){ if(typeof viewY==='undefined'){ viewY=2026; viewM=8; render(); } },2500);
</script>
</body>
</html>
